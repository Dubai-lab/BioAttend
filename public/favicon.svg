<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72">
  <!--
    Northcrest General shield, as the browser tab icon.

    Drawn slightly heavier than the sidebar mark: at 16x16 the chevron and the
    cross arms would otherwise disappear. Favicons are read at a glance, so the
    silhouette matters more than fidelity to the full-size lockup.
  -->
